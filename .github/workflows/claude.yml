# Lets Claude work on tickets without you at the keyboard.
#
# Comment "@claude implement this" on an issue (or open an issue whose body
# contains @claude) and this workflow runs Claude Code on a GitHub runner.
# It pushes a branch and opens a pull request for you to review.
#
# ---------------------------------------------------------------------------
# BEFORE THIS WORKS, two one-time steps that only you can do:
#
#   1. Install the Claude GitHub App on this repo:  https://github.com/apps/claude
#   2. Add an ANTHROPIC_API_KEY repository secret:
#        Settings -> Secrets and variables -> Actions -> New repository secret
#      Get the key from https://console.anthropic.com
#
# Running `/install-github-app` inside an interactive `claude` terminal does
# both of those for you.
#
# ---------------------------------------------------------------------------
# COST: this bills to the API key above, which is separate from a Claude Code
# subscription. Every @claude mention is a full agent run, so two comments
# means two runs and two bills. The `if:` guard, --max-turns and the timeout
# below all exist to keep that bounded. Put everything you want into one
# comment rather than several.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR
  issues: write          # reply on the ticket
  id-token: write

jobs:
  claude:
    # Only wake up when actually summoned. Without this guard every comment
    # on every issue would start a paid run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One run per ticket at a time, so a burst of comments can't fan out.
    concurrency:
      group: claude-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so Claude can read the log for context

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
